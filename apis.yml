description: 'eHi Car Rental (一嗨租车), operated by Shanghai eHi Information Technology
  Services Co., Ltd., is one of China''s leading car rental and mobility companies.
  Founded in 2006 and headquartered in Shanghai, eHi offers self-drive car rentals,
  chauffeured car service, used-car sales, and corporate and government mobility programs
  across more than 500 cities nationwide, with cross-city return and airport pickup.
  eHi is a portfolio company of Qiming Venture Partners, added to the API Evangelist
  network as a company profile. The business operates consumer web and mobile (iOS,
  Android, HarmonyOS) booking channels; no public developer or API platform was found
  during enrichment.'
